<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NDLER - Police Field Scanner PWA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex items-center justify-center p-4" x-data="fieldScannerState()">
    <!-- MOBILE PHONE FRAME -->
    <div class="bg-slate-900 border-4 border-slate-800 rounded-3xl overflow-hidden shadow-2xl w-full max-w-sm h-[720px] flex flex-col relative">
        <!-- STATUS BAR -->
        <div class="bg-slate-950 px-6 py-2.5 flex justify-between items-center text-[11px] font-mono text-slate-400 border-b border-slate-800">
            <span>09:41 AM</span>
            <div class="flex items-center space-x-2">
                <span class="text-emerald-400 flex items-center"><i class="fa-solid fa-hard-drive mr-1"></i> <span x-text="localCache.length + ' CACHED'"></span></span>
                <i class="fa-solid fa-signal text-blue-400"></i>
                <i class="fa-solid fa-battery-full text-emerald-400"></i>
            </div>
        </div>
        <!-- APP HEADER -->
        <div class="bg-slate-900 p-4 border-b border-slate-800 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <div class="bg-blue-600 text-white p-1.5 rounded-lg text-xs">
                    <i class="fa-solid fa-binoculars"></i>
                </div>
                <div>
                    <h2 class="font-bold text-xs">Field Enforcement PWA</h2>
                    <p class="text-[10px] text-slate-400">Badge: <span class="text-blue-400 font-bold" x-text="officerId"></span></p>
                </div>
            </div>
            <button @click="resetScanner()" class="text-xs bg-slate-800 hover:bg-slate-700 px-2 py-1 rounded text-slate-300">Reset</button>
        </div>
        <!-- VIEWFINDER & SCAN BODY -->
        <div class="flex-1 bg-slate-950 p-4 flex flex-col overflow-y-auto">
            <template x-if="scannerState === 'viewfinder'">
                <div class="flex-1 flex flex-col items-center justify-center space-y-4 text-center">
                    <div class="flex justify-between w-full px-2 text-[10px] text-emerald-400 font-mono bg-slate-900 p-1.5 rounded border border-slate-800">
                        <span>GPS: <span x-text="gpsCoords.lat"></span>, <span x-text="gpsCoords.lng"></span></span>
                        <span>🔴 LIVE TRACKING</span>
                    </div>
                    <p class="text-xs text-slate-400">Position subject's face within the live camera reticle</p>
                    <div class="relative w-56 h-56 rounded-full border-4 border-dashed border-blue-500/50 flex items-center justify-center bg-slate-900 overflow-hidden shadow-inner">
                        <video x-ref="scannerVideo" autoplay playsinline class="absolute inset-0 w-full h-full object-cover"></video>
                        <div class="absolute inset-0 bg-blue-500/10 animate-pulse pointer-events-none"></div>
                    </div>
                    <button @click="scanFace()" class="w-full py-3.5 bg-blue-600 hover:bg-blue-500 text-white rounded-xl font-bold text-xs tracking-wider uppercase transition shadow-lg">
                        <i class="fa-solid fa-camera mr-1"></i> Scan Face & Verify
                    </button>
                </div>
            </template>
            <template x-if="scannerState === 'scanning'">
                <div class="flex-1 flex flex-col items-center justify-center space-y-4 text-center">
                    <div class="w-16 h-16 rounded-full border-4 border-blue-500 border-t-transparent animate-spin"></div>
                    <p class="text-xs font-bold text-blue-400 animate-pulse">Matching live face against encrypted local cache...</p>
                </div>
            </template>
            <template x-if="scannerState === 'result'">
                <div class="flex-1 space-y-4">
                    <template x-if="scannedResult.status && scannedResult.status !== 'Wanted' && scannedResult.status !== 'No Match'">
                        <div class="bg-emerald-950/40 border border-emerald-500/40 rounded-2xl p-4 space-y-3">
                            <div class="font-bold text-xs py-1.5 rounded text-center uppercase border bg-emerald-500 text-slate-950 border-emerald-500">
                                <i class="fa-solid fa-circle-check mr-1"></i> Status: <span x-text="scannedResult.status"></span>
                            </div>
                            <div class="flex items-center space-x-3">
                                <img :src="scannedResult.photo" class="w-16 h-16 rounded-xl object-cover border border-slate-700" alt="">
                                <div>
                                    <h3 class="font-bold text-sm text-white" x-text="scannedResult.name"></h3>
                                    <p class="text-xs text-blue-400 font-mono" x-text="'NID: ' + scannedResult.idNum"></p>
                                    <p class="text-xs text-slate-300 font-mono" x-text="'Phone: ' + (scannedResult.phone || 'N/A')"></p>
                                    <p class="text-xs text-slate-400" x-text="'Location: ' + (scannedResult.subcity || '') + ' / Woreda ' + (scannedResult.woreda || '')"></p>
                                </div>
                            </div>
                        </div>
                    </template>
                    <template x-if="scannedResult.status === 'Wanted'">
                        <div class="bg-red-950/90 border-4 border-red-500 rounded-2xl p-4 space-y-3 animate-pulse shadow-2xl shadow-red-500/50">
                            <div class="bg-red-600 text-white font-black text-xs py-2 rounded text-center uppercase tracking-widest shadow flex items-center justify-center space-x-2">
                                <i class="fa-solid fa-triangle-exclamation text-base animate-bounce"></i>
                                <span>🚨 EMERGENCY ALARM: WANTED 🚨</span>
                            </div>
                            <div class="flex items-center space-x-3">
                                <img :src="scannedResult.photo" class="w-16 h-16 rounded-xl object-cover border-2 border-red-500" alt="">
                                <div>
                                    <h3 class="font-bold text-sm text-white" x-text="scannedResult.name"></h3>
                                    <p class="text-xs text-red-300 font-mono" x-text="'NID: ' + scannedResult.idNum"></p>
                                    <p class="text-xs text-red-200 font-mono" x-text="'Phone: ' + (scannedResult.phone || 'N/A')"></p>
                                    <p class="text-xs text-red-200" x-text="'Subcity: ' + (scannedResult.subcity || '') + ' (Woreda ' + (scannedResult.woreda || '') + ')'"></p>
                                </div>
                            </div>
                            <div class="bg-red-900/60 p-2.5 rounded-lg border border-red-500/50 text-xs text-red-100 font-semibold">
                                📡 Phone Tracker Active: Cell tower triangulation locked. Live GPS coordinates transmitting to HQ.
                            </div>
                            <button @click="triggerBackup()" class="w-full py-2.5 bg-red-600 hover:bg-red-500 text-white rounded-xl font-bold text-xs uppercase tracking-wider transition shadow-lg">
                                <i class="fa-solid fa-walkie-talkie mr-1"></i> Request Backup Instantly
                            </button>
                        </div>
                    </template>
                    <template x-if="scannedResult.status === 'No Match'">
                        <div class="bg-slate-900 border border-slate-700 rounded-2xl p-4 space-y-3 text-center">
                            <div class="w-14 h-14 bg-slate-800 text-slate-400 rounded-full flex items-center justify-center mx-auto text-lg">
                                <i class="fa-solid fa-user-slash"></i>
                            </div>
                            <h3 class="font-bold text-sm text-slate-100">No Registry Record Found</h3>
                            <p class="text-xs text-slate-400">Proceed with manual physical ID verification.</p>
                        </div>
                    </template>
                    <button @click="resetScanner()" class="w-full py-2.5 bg-slate-800 hover:bg-slate-700 text-white rounded-xl font-semibold transition">Scan Next</button>
                </div>
            </template>
        </div>
        <!-- FOOTER -->
        <div class="bg-slate-950 p-2.5 text-center border-t border-slate-800">
            <p class="text-[9px] text-slate-500 font-mono">SECURE FIELD ENFORCEMENT PWA</p>
        </div>
    </div>
    <script>
        function fieldScannerState() {
            return {
                officerId: 'OFFICER-' + Math.floor(1000 + Math.random() * 9000),
                scannerState: 'viewfinder',
                scannedResult: null,
                localCache: [],
                mediaStream: null,
                alarmInterval: null,
                gpsCoords: { lat: '9.0320° N', lng: '38.7421° E' },

                init() {
                    localStorage.setItem('ndler_my_officer_id', this.officerId);
                    this.startCamera();
                    this.startLocationBeacon();
                },

                startLocationBeacon() {
                    setInterval(() => {
                        // simulate slight GPS jitter
                        const latVal = (9.0300 + Math.random() * 0.005).toFixed(4) + '° N';
                        const lngVal = (38.7400 + Math.random() * 0.005).toFixed(4) + '° E';
                        this.gpsCoords = { lat: latVal, lng: lngVal };

                        const activeOfficers = JSON.parse(localStorage.getItem('ndler_online_officers') || '{}');
                        activeOfficers[this.officerId] = {
                            code: this.officerId,
                            status: 'On Patrol',
                            coords: this.gpsCoords,
                            lastPing: Date.now()
                        };
                        localStorage.setItem('ndler_online_officers', JSON.stringify(activeOfficers));
                    }, 3000);
                },

                startCamera() {
                    navigator.mediaDevices.getUserMedia({ video: true })
                        .then(stream => {
                            this.mediaStream = stream;
                            if(this.$refs.scannerVideo) { this.$refs.scannerVideo.srcObject = stream; }
                        })
                        .catch(err => { console.log('Camera note: ' + err.message); });
                },

                playAlarmSound() {
                    try {
                        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                        let beepCount = 0;
                        this.alarmInterval = setInterval(() => {
                            if (beepCount >= 6 || this.scannerState !== 'result') {
                                clearInterval(this.alarmInterval);
                                return;
                            }
                            const osc = audioCtx.createOscillator();
                            const gain = audioCtx.createGain();
                            osc.type = 'sawtooth';
                            osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                            osc.connect(gain);
                            gain.connect(audioCtx.destination);
                            osc.start();
                            osc.stop(audioCtx.currentTime + 0.3);
                            beepCount++;
                        }, 400);
                    } catch (e) { console.log('Audio restricted'); }
                },

                refreshCache() {
                    const stored = localStorage.getItem('ndler_citizens');
                    this.localCache = stored ? JSON.parse(stored) : [];
                },

                scanFace() {
                    this.refreshCache();
                    this.scannerState = 'scanning';
                    setTimeout(() => {
                        if (this.localCache.length === 0) {
                            this.scannedResult = { status: 'No Match' };
                        } else {
                            const outcomes = [...this.localCache, { status: 'No Match' }];
                            this.scannedResult = outcomes[Math.floor(Math.random() * outcomes.length)];
                        }
                        this.scannerState = 'result';

                        if (this.scannedResult.status === 'Wanted') {
                            this.playAlarmSound();
                        }

                        const logs = JSON.parse(localStorage.getItem('ndler_scan_logs') || '[]');
                        logs.push({
                            id: Date.now(),
                            name: this.scannedResult.name || 'Unknown Subject',
                            idNum: this.scannedResult.idNum || 'N/A',
                            status: this.scannedResult.status,
                            officer: this.officerId,
                            location: `${this.gpsCoords.lat}, ${this.gpsCoords.lng}`,
                            time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'})
                        });
                        localStorage.setItem('ndler_scan_logs', JSON.stringify(logs));
                    }, 1200);
                },

                triggerBackup() {
                    alert(`🚨 BACKUP REQUESTED! GPS (${this.gpsCoords.lat}, ${this.gpsCoords.lng}) & Badge ${this.officerId} transmitted to Command Center.`);
                },

                resetScanner() {
                    if (this.alarmInterval) clearInterval(this.alarmInterval);
                    this.scannerState = 'viewfinder';
                    this.scannedResult = null;
                    this.$nextTick(() => { this.startCamera(); });
                }
            }
        }
    </script>
</body>
</html>
